  @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } }

  .log-panel {

  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

<body>

<div class="stars" id="stars"></div>

<div class="game-container">
  <h1>🏴‍☠️ 寻宝大冒险 🏴‍☠️</h1>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%;"></div></div>
  <div class="scene" id="scene">
    <div class="scene-title" id="sceneTitle">准备出发...</div>
    <div class="character" id="character" style="top: 70%; left: 50%;">🧭</div>
  </div>
  <div class="log-panel" id="logPanel">
    <div class="log-entry log-info">🎮 欢迎来到寻宝大冒险！点击「开始冒险」按钮开启你的寻宝之旅...</div>
  </div>
  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="startTreasureHunt()">🚀 开始冒险</button>
    <button class="btn-restart" id="restartBtn" onclick="restartGame()" disabled>🔄 重新开始</button>
  </div>
  <p class="hint">💡 提示：冒险过程中会遇到谜题和抉择，请根据提示做出选择！</p>
</div>

<div class="modal" id="puzzleModal">
  <div class="modal-content">
    <h3>🔐 神秘密码门</h3>
    <p id="puzzleText">古老的门上刻着一道谜题...</p>
    <input type="text" id="puzzleInput" placeholder="输入你的答案" onkeydown="if(event.key==='Enter') submitPuzzle()">
    <div class="choice-buttons"><button class="choice-btn" onclick="submitPuzzle()">确认</button></div>
  </div>
</div>

<div class="modal" id="forkModal">
  <div class="modal-content">
    <h3>🌲 岔路口</h3>
    <p>你来到了一个神秘的岔路口，两条路看起来都通向未知...</p>
    <div class="choice-buttons">
      <button class="choice-btn" onclick="choosePath('left')">⬅️ 走左边</button>
      <button class="choice-btn" onclick="choosePath('right')">➡️ 走右边</button>
    </div>
  </div>
</div>

<script>
const scene = document.getElementById('scene');
const sceneTitle = document.getElementById('sceneTitle');
const character = document.getElementById('character');
const logPanel = document.getElementById('logPanel');
const progressFill = document.getElementById('progressFill');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let forkResolve = null, puzzleResolve = null;

function initStars() {
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = '✦';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    starsContainer.appendChild(star);
  }
}
initStars();

function addLog(message, type = 'info') {
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  const iconMap = { info: '📖', success: '✅', warning: '⚠️', error: '❌', treasure: '🏆' };
  entry.innerHTML = `${iconMap[type] || ''} ${message}`;
  logPanel.appendChild(entry);
  logPanel.scrollTop = logPanel.scrollHeight;
}

function switchScene(sceneClass, title, emoji, posX = '50%') {
  scene.className = 'scene';
  scene.classList.add(sceneClass);
  sceneTitle.textContent = title;
  character.textContent = emoji;
  character.style.left = posX;
}

function updateProgress(percent) { progressFill.style.width = percent + '%'; }
const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

class TreasureMap {
  static async getInitialClue() {
    await delay(1000);
    return "在古老的图书馆里找到了第一个线索...";
  }
  static async decodeAncientScript(clue) {
    await delay(1500);
    if (!clue) throw new Error("没有线索可以解码!");
    return "解码成功!线索指向一座被密码门守护的遗迹...";
  }
  static async solvePuzzleDoor() {
    addLog("一扇刻满神秘符文的大门挡住了去路...", "warning");
    const answer = await askPuzzle();
    if (answer === "13") return "密码正确!大门缓缓打开，里面传来阵阵冷风...";
    throw new Error("密码错误!门上的符文熄灭了，你需要重新开始!");
  }
  static async chooseForkPath() {
    addLog("你来到了一个神秘的岔路口...", "info");
    const winnerResult = await Promise.race([
      Promise.all([this.exploreLeftPath(), Promise.resolve('left')]),
      Promise.all([this.exploreRightPath(), Promise.resolve('right')])
    ]);
    return winnerResult;
  }
  static async exploreLeftPath() { await delay(2200); return "左边的路通向了一片迷雾森林..."; }
  static async exploreRightPath() { await delay(1800); return "右边的路很快就找到了捷径!"; }
  static async searchTemple(location) {
    await delay(2000);
    const random = Math.random();
    if (random < 0.35) throw new Error("糟糕!遇到了神庙守卫的陷阱!");
    if (random < 0.6) {
      const retry = await encounterTrap();
      if (!retry) throw new Error("你被困住了，寻宝失败!");
      return retry;
    }
    return "你成功绕过重重机关，找到了一个神秘的箱子...";
  }
  static async encounterTrap() {
    addLog("⚠️ 你触发了一个古老的陷阱机关! 可以选择快速脱身...", "error");
    await delay(1500);
    if (Math.random() < 0.6) return "你敏捷地跳过了陷阱，继续前进!";
    return null;
  }
  static async openTreasureBox() {
    await delay(1000);
    return "恭喜!你打开了传说中的宝箱...";
  }
}

function askPuzzle() {
  return new Promise(resolve => {
    const modal = document.getElementById('puzzleModal');
    const puzzleText = document.getElementById('puzzleText');
    const input = document.getElementById('puzzleInput');
    puzzleText.innerHTML = `智慧之门需要正确的数字密码<br>"1, 1, 2, 3, 5, 8, ?"<br>问号处应该填什么数字？`;
    input.value = '';
    modal.classList.add('active');
    input.focus();
    puzzleResolve = () => { modal.classList.remove('active'); resolve(input.value.trim()); };
  });
}
function submitPuzzle() { if (puzzleResolve) puzzleResolve(); }

async function findTreasureWithAsync() {
  startBtn.disabled = true; restartBtn.disabled = true;
  logPanel.innerHTML = ''; updateProgress(0);
  addLog("🧭 冒险开始！你踏入了传说中的寻宝之地...", "info");
  await delay(500);

  try {
    switchScene('library', '📚 古老图书馆', '🧑‍🎓', '20%');
    addLog("你走进了满是灰尘的图书馆...", "info");
    const clue = await TreasureMap.getInitialClue();
    addLog(clue, "success"); updateProgress(15);

    await delay(800);
    switchScene('decode', '📜 解码古老文字', '🧙', '50%');
    const location = await TreasureMap.decodeAncientScript(clue);
    addLog(location, "success"); updateProgress(30);

    await delay(800);
    switchScene('puzzle-door', '🔐 神秘密码门', '🧑‍🎓', '50%');
    const doorResult = await TreasureMap.solvePuzzleDoor();
    addLog(doorResult, "success"); updateProgress(45);

    await delay(800);
    switchScene('fork', '🌲 神秘岔路口', '🧑‍🎓', '45%');
    addLog("你来到了岔路口，两条路同时探索...", "info");
    const [pathMsg, pathDir] = await TreasureMap.chooseForkPath();
    addLog(`🏃 ${pathDir === 'left' ? '左边' : '右边'}的队伍先传来消息：${pathMsg}`, "success");
    updateProgress(60);

    await delay(800);
    switchScene('temple', '🏛️ 神秘神庙', '🧑‍🎓', '40%');
    addLog("你小心翼翼地走进了古老的神庙...", "info");
    let boxMsg = null;
    for (let attempt = 1; attempt <= 2; attempt++) {
      try { boxMsg = await TreasureMap.searchTemple(pathMsg); break; }
      catch (e) {
        if (attempt < 2) {
          addLog(`${e.message} 但你还有一次机会!`, "warning");
          switchScene('trap', '⚠️ 遭遇陷阱!', '😱', '50%');
          await delay(1000);
          switchScene('temple', '🏛️ 再次尝试', '🧑‍🎓', '40%');
        } else throw e;
      }
    }
    addLog(boxMsg, "success"); updateProgress(75);

    await delay(800);
    switchScene('treasure-box', '📦 神秘宝箱', '🧑‍🎓', '60%');
    const treasureMsg = await TreasureMap.openTreasureBox();
    addLog(treasureMsg, "success"); updateProgress(90);

    await delay(800);
    switchScene('treasure-final', '👑 传说宝藏!', '🏆', '50%');
    addLog("✨ 耀眼的光芒照亮了整个房间!", "treasure");
    addLog("🎊 你成功找到了传说中的宝藏!", "treasure");
    updateProgress(100);
    restartBtn.disabled = false;
  } catch (error) {
    switchScene('trap', '💀 冒险失败', '💀', '50%');
    addLog(`${error.message}`, "error");
    addLog("冒险失败...点击重新开始再来一次吧!", "warning");
    restartBtn.disabled = false;
  }
}

function startTreasureHunt() { findTreasureWithAsync(); }
function restartGame() {
  scene.className = 'scene'; sceneTitle.textContent = '准备出发...';
  character.textContent = '🧭'; character.style.left = '50%';
  progressFill.style.width = '0%';
  logPanel.innerHTML = '<div class="log-entry log-info">🎮 冒险已重置...点击开始继续寻宝吧!</div>';
  startBtn.disabled = false; restartBtn.disabled = true;
}

window.addEventListener('load', () => {
  addLog("💡 提示：冒险过程中会遇到密码门谜题，需要回答斐波那契数列的下一个数字哦！", "info");
});
</script>
</body>
