<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);

    overflow-x: hidden;

  .game-container { max-width: 900px; margin: 30px auto; padding: 20px; position: relative; }
  h1 {
    text-align: center; font-size: 2.5rem; margin-bottom: 20px;
    background: linear-gradient(45deg, #ffd700, #ffed4e, #ffd700);

  }
  @keyframes titleGlow {
    from { filter: drop-shadow(0 0 10px #ffd700); }
    to { filter: drop-shadow(0 0 25px #ff8c00); }
  }
  .scene {
    width: 100%; height: 350px; border-radius: 15px; overflow: hidden;
    position: relative; margin-bottom: 20px;
    box-shadow: 0 0 40px rgba(255,215,0,0.3); border: 3px solid #ffd700; background: #000;
  }
  .scene-title {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 1.5rem; color: #fff; background: rgba(0,0,0,0.6);
    padding: 8px 25px; border-radius: 25px; border: 2px solid #ffd700; white-space: nowrap; z-index: 10;
  }

    position: absolute; font-size: 3rem; top: 70%; left: 50%;

  }
  .library { background: linear-gradient(to bottom, #4a3728 0%, #6b4423 100%); }
  .library::before {
    content: '📚'; position: absolute; font-size: 4rem; top: 60%; left: 10%; z-index: 5;
    animation: float 3s ease-in-out infinite;
  }
  .library::after {
    content: '🕯️'; position: absolute; font-size: 3rem; top: 20%; right: 15%; z-index: 5;
    animation: flicker 0.5s ease-in-out infinite alternate;
  }
  @keyframes flicker { from { opacity: 0.8; transform: scale(1); } to { opacity: 1; transform: scale(1.1); } }
  .decode { background: linear-gradient(to bottom, #2c1810 0%, #4a3728 100%); }
  .decode::before {
    content: '📜'; position: absolute; font-size: 5rem; top: 45%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%); animation: pulse 1.5s ease-in-out infinite;
  }
  .decode::after {
    content: '🔮'; position: absolute; font-size: 3rem; top: 15%; right: 20%; z-index: 5;
    animation: float 2s ease-in-out infinite;
  }
  .puzzle-door { background: linear-gradient(to bottom, #1a1a2e 0%, #2c1810 100%); }
  .puzzle-door::before {
    content: '🚪'; position: absolute; font-size: 6rem; top: 40%; left: 50%; z-index: 5;
    transform: translateX(-50%);
  }
  .puzzle-door::after {
    content: '🔐'; position: absolute; font-size: 2.5rem; top: 55%; left: 50%; z-index: 5;
    transform: translateX(-50%); animation: shake 0.3s ease-in-out infinite alternate;
  }
  @keyframes shake { from { transform: translateX(-50%) rotate(-5deg); } to { transform: translateX(-50%) rotate(5deg); } }
  .gather { background: linear-gradient(to bottom, #0a1628 0%, #1a2a4a 100%); }
  .gather::before {
    content: '🌕'; position: absolute; font-size: 4rem; top: 10%; left: 50%; z-index: 5;
    animation: pulse 2s ease-in-out infinite;
  }
  .gather::after {
    content: '💎'; position: absolute; font-size: 2.5rem; z-index: 5;
    animation: float 1.5s ease-in-out infinite;
  }
  .stone-1::after { top: 60%; left: 15%; }
  .stone-2::after { top: 60%; left: 50%; animation-delay: 0.3s; }
  .stone-3::after { top: 60%; left: 85%; animation-delay: 0.6s; }
  .star-puzzle { background: linear-gradient(to bottom, #1a0a2e 0%, #2d1b4a 100%); }
  .star-puzzle::before {
    content: '✨'; position: absolute; font-size: 4rem; top: 40%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%); animation: pulse 1s ease-in-out infinite;
  }
  .temple { background: linear-gradient(to bottom, #8b7355 0%, #5c4033 100%); }
  .temple::before {
    content: '🏛️'; position: absolute; font-size: 5rem; top: 30%; left: 50%; z-index: 5;
    transform: translateX(-50%);
  }
  .trap { background: linear-gradient(to bottom, #4a0000 0%, #2d0000 100%); }
  .trap::before {
    content: '⚠️'; position: absolute; font-size: 4rem; top: 50%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%); animation: danger 0.3s ease-in-out infinite;
  }
  @keyframes danger { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.2); } }
  .treasure-box { background: linear-gradient(to bottom, #2d1f00 0%, #1a1400 100%); }
  .treasure-box::before {
    content: '📦'; position: absolute; font-size: 5rem; top: 50%; left: 50%; z-index: 5;
    transform: translate(-50%, -50%); animation: boxBounce 1s ease-in-out infinite;
  }
  @keyframes boxBounce { 0%,100%{transform:translate(-50%,-50%) translateY(0);} 50%{transform:translate(-50%,-50%) translateY(-10px);} }
  .treasure-final {
    background: radial-gradient(ellipse at center, #ffd700 0%, #ff8c00 30%, #8b4513 70%);
    animation: goldenGlow 2s ease-in-out infinite alternate;
  }
  @keyframes goldenGlow {
    from { box-shadow: inset 0 0 100px rgba(255,215,0,0.5); }
    to { box-shadow: inset 0 0 150px rgba(255,255,255,0.7); }
  }
  .treasure-final::before {
    content: '💎'; position: absolute; font-size: 6rem; top: 35%; left: 30%; z-index: 5;
    animation: float 2s ease-in-out infinite;
  }
  .treasure-final::after {
    content: '👑'; position: absolute; font-size: 6rem; top: 35%; right: 30%; z-index: 5;
    animation: float 2.5s ease-in-out infinite reverse;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes pulse { 0%,100%{opacity:0.8;} 50%{opacity:1;} }

  .log-panel {
    background: rgba(0,0,0,0.7); border-radius: 10px; padding: 15px;
    height: 200px; overflow-y: auto; border: 2px solid #ffd700;
  }
  .log-panel::-webkit-scrollbar { width: 8px; }
  .log-panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .log-panel::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 4px; }
  .log-entry {
    padding: 8px 12px; margin-bottom: 8px; border-radius: 5px;
    animation: slideIn 0.5s ease-out; font-size: 0.95rem; line-height: 1.5;
  }
  .log-info { background: rgba(100,149,237,0.3); border-left: 3px solid #6495ed; color: #e0e0e0; }
  .log-success { background: rgba(50,205,50,0.3); border-left: 3px solid #32cd32; color: #98fb98; }
  .log-warning { background: rgba(255,165,0,0.3); border-left: 3px solid #ffa500; color: #ffd89b; }
  .log-error { background: rgba(255,0,0,0.3); border-left: 3px solid #ff0000; color: #ff9999; }
  .log-treasure {
    background: linear-gradient(90deg, rgba(255,215,0,0.5), rgba(255,140,0,0.5));
    border-left: 3px solid #ffd700; color: #fff; font-weight: bold; font-size: 1.1rem;
    animation: treasurePop 0.8s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes treasurePop { 0%{opacity:0;transform:scale(0.8);} 50%{transform:scale(1.05);} 100%{opacity:1;transform:scale(1);} }
  .controls { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  button {
    padding: 12px 30px; font-size: 1rem; font-weight: bold;
    border: none; border-radius: 25px; cursor: pointer;
    transition: all 0.3s ease; font-family: inherit;
  }
  .btn-start { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #1a1a2e; box-shadow: 0 4px 15px rgba(255,140,0,0.4); }
  .btn-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,140,0,0.6); }
  .btn-restart { background: linear-gradient(45deg, #6495ed, #4169e1); color: white; box-shadow: 0 4px 15px rgba(65,105,225,0.4); }
  .btn-restart:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(65,105,225,0.6); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 15px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); border-radius: 4px; transition: width 0.5s ease; }
  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  .star { position: absolute; color: #ffd700; font-size: 1rem; animation: twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .hint { text-align: center; color: #aaa; margin-top: 10px; font-size: 0.85rem; }
</style>

<body>

<div class="stars" id="stars"></div>
<div class="game-container">
  <h1>🏴‍☠️ 寻宝大冒险 · 月影篇 🏴‍☠️</h1>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
  <div class="scene" id="scene">
    <div class="scene-title" id="sceneTitle">准备出发...</div>
    <div class="character" id="character" style="top:70%;left:50%;">🧭</div>
  </div>
  <div class="log-panel" id="logPanel">
    <div class="log-entry log-info">🎮 欢迎来到寻宝大冒险（月影篇）！点击"开始冒险"按钮开启你的寻宝之旅...</div>
  </div>
  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="startTreasureHunt()">🚀 开始冒险</button>
    <button class="btn-restart" id="restartBtn" onclick="restartGame()" disabled>🔄 重新开始</button>
  </div>
  <p class="hint">💡 提示：本次冒险包含「三处并行搜寻月光石」「星盘解谜」「潜入重试」等情节！</p>
</div>

<script>
const scene = document.getElementById('scene');
const sceneTitle = document.getElementById('sceneTitle');
const character = document.getElementById('character');
const logPanel = document.getElementById('logPanel');
const progressFill = document.getElementById('progressFill');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const delay = (ms) => new Promise(r => setTimeout(r, ms));

function initStars() {
  const sc = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'star'; s.textContent = '✦';
    s.style.left = Math.random()*100 + '%'; s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*2 + 's';
    sc.appendChild(s);
  }
}
initStars();

function addLog(msg, type='info') {
  const entry = document.createElement('div');
  entry.className = `log-entry log-${type}`;
  const icon = { info:'📖', success:'✅', warning:'⚠️', error:'❌', treasure:'🏆' }[type] || '';
  entry.innerHTML = `${icon} ${msg}`;
  logPanel.appendChild(entry);
  logPanel.scrollTop = logPanel.scrollHeight;
}
function switchScene(cls, title, emoji, posX='50%') {
  scene.className = 'scene'; scene.classList.add(cls);
  sceneTitle.textContent = title; character.textContent = emoji; character.style.left = posX;
}
function updateProgress(p) { progressFill.style.width = p + '%'; }

// ====== 宝藏地图类（async/await + Promise.all 并行月光石）======
class TreasureMap {
  static async getInitialClue() {
    await delay(1000);
    return "在古老的图书馆里找到了第一张羊皮卷...";
  }
  static async decodeAncientScript(clue) {
    await delay(1500);
    if (!clue) throw new Error("没有线索可以解码!");
    return "解码成功!宝藏在一座被迷雾环绕的月影神庙中...";
  }
  // 🆕 新情节 1：三处同时搜寻月光石（Promise.all）
  static async gatherMoonstones() {
    const spots = [
      { name: "湖心", delay: 1200 },
      { name: "树洞", delay: 1600 },
      { name: "石缝", delay: 1000 },
    ];
    addLog("🌕 三处月光石同时搜寻中...（并行进行）", "info");
    const stones = await Promise.all(
      spots.map(async ({ name, delay: d }) => {
        await delay(d);
        addLog(`  ✨ ${name}月光石到手！`, "success");
        return `${name}月光石`;
      })
    );
    return stones;
  }
  // 🆕 新情节 2：星盘谜题
  static async solveStarPuzzle(stones) {
    await delay(1500);
    if (stones.length < 3) throw new Error("月光石不足三颗，星盘无法点亮!");
    return "三颗月光石嵌入星盘，星轨对齐，通往神庙的石门缓缓打开...";
  }
  static async searchTemple() {
    await delay(2000);
    if (Math.random() < 0.5) throw new Error("糟糕!遇到了神庙守卫!");
    return "守卫正在打盹，你悄悄潜入了内殿，找到一个神秘的箱子...";
  }
  // 🆕 新情节 3：潜入重试（循环重试 + 错误处理）
  static async sneakInto(maxAttempts = 3) {
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        addLog(`第 ${attempt} 次潜入神庙...`, "info");
        const result = await TreasureMap.searchTemple();
        return result;
      } catch (error) {
        addLog(`  ❌ 潜入失败：${error.message}`, "error");
        if (attempt === maxAttempts) throw new Error("三次潜入都失败了，只能改日再来。");
        addLog("  🕯️ 点起驱兽香，重新寻找潜入路线...", "warning");
        await delay(800);
      }
    }
  }
  static async openTreasureBox() {
    await delay(1000);
    return "恭喜!你找到了传说中的宝藏——星海之泪!";
  }
}

// ====== 主流程 ======
async function findTreasureWithAsync() {
  startBtn.disabled = true; restartBtn.disabled = true;
  logPanel.innerHTML = ''; updateProgress(0);
  addLog("🧭 冒险开始！你踏入了月影森林...", "info");
  await delay(500);

  try {
    // Step 1
    switchScene('library', '📚 古老图书馆', '🧑‍🎓', '20%');
    addLog("你走进了满是灰尘的图书馆...", "info");
    const clue = await TreasureMap.getInitialClue();
    addLog(clue, "success"); updateProgress(15);

    await delay(800);
    // Step 2
    switchScene('decode', '📜 解码古文字', '🧙', '50%');
    const location = await TreasureMap.decodeAncientScript(clue);
    addLog(location, "success"); updateProgress(28);

    await delay(800);
    // Step 3（新：并行搜寻月光石）
    switchScene('gather', '🌕 并行搜寻月光石', '🧑‍🎓', '45%');
    const stones = await TreasureMap.gatherMoonstones();
    addLog(`🎉 集齐三颗月光石！`, "success"); updateProgress(45);

    await delay(500);
    // Step 4（新：星盘谜题）
    switchScene('star-puzzle', '✨ 星盘谜题', '🧙', '50%');
    const door = await TreasureMap.solveStarPuzzle(stones);
    addLog(door, "success"); updateProgress(58);

    await delay(800);
    // Step 5（新：潜入重试）
    switchScene('temple', '🏛️ 月影神庙', '🧑‍🎓', '40%');
    addLog("你小心翼翼地逼近神庙...", "info");
    const boxMsg = await TreasureMap.sneakInto(3);
    addLog(boxMsg, "success"); updateProgress(78);

    await delay(800);
    // Step 6
    switchScene('treasure-box', '📦 神秘宝箱', '🧑‍🎓', '60%');
    const treasureMsg = await TreasureMap.openTreasureBox();
    addLog(treasureMsg, "success"); updateProgress(92);

    await delay(800);
    // Step 7
    switchScene('treasure-final', '👑 星海之泪!', '🏆', '50%');
    addLog("✨ 耀眼的金色光芒照亮了整个月影森林!", "treasure");
    addLog("🎊 恭喜你获得了传说中的「星海之泪」!", "treasure");
    updateProgress(100);
    restartBtn.disabled = false;
  } catch (error) {
    switchScene('trap', '💀 冒险失败', '💀', '50%');
    addLog(`${error.message}`, "error");
    addLog("冒险失败...点击重新开始再来一次吧!", "warning");
    restartBtn.disabled = false;
  }
}

function startTreasureHunt() { findTreasureWithAsync(); }
function restartGame() {
  scene.className = 'scene'; sceneTitle.textContent = '准备出发...';
  character.textContent = '🧭'; character.style.left = '50%';
  progressFill.style.width = '0%';
  logPanel.innerHTML = '<div class="log-entry log-info">🎮 冒险已重置...点击开始继续寻宝吧!</div>';
  startBtn.disabled = false; restartBtn.disabled = true;
}
</script>
</body>
